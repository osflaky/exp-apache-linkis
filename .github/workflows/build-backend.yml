name: Build Backend

on:
  workflow_dispatch:

env:
  MAVEN_OPTS: -Dmaven.resolver.transport=wagon 
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=30 -Xmx16g 
    -XX:MetaspaceSize=4g -XX:ReservedCodeCacheSize=2g

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - profile: default
          expander_leg: ubuntu-latest--x64
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 8
        cache: maven
    # Default: Spark 2.4 + Hadoop 2.7
    - if: ${{matrix.profile == 'default'}}
      name: build default (Spark 2.4 + Hadoop 2.7)
      run: ./mvnw -T 4C clean package -Dmaven.test.skip=true
    # Spark 3.4 only
    - if: ${{matrix.profile == 'spark-3'}}
      name: build Spark 3.4 (Hadoop 2.7)
      run: ./mvnw -T 4C clean package -Pspark-3 -Dmaven.test.skip=true
    # Hadoop 3.3 only (with Spark 2.4)
    - if: ${{matrix.profile == 'hadoop-3.3'}}
      name: build Hadoop 3.3 (Spark 2.4)
      run: ./mvnw -T 4C clean package -Phadoop-3.3 -Dmaven.test.skip=true
    # Spark 3.4 + Hadoop 3.3
    - if: ${{matrix.profile == 'spark-3-hadoop-3.3'}}
      name: build Spark 3.4 + Hadoop 3.3
      run: ./mvnw -T 4C clean package -Pspark-3 -Phadoop-3.3 
        -Dmaven.test.skip=true
#    - name: Upload coverage to Codecov
#      uses: codecov/codecov-action@v3.0.0
#      with:
#        token: ${{ secrets.CODECOV_TOKEN }}
    name: build-backend [${{ matrix.expander_leg }}]
    timeout-minutes: 150
